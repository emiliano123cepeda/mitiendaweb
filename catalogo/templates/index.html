<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tienda de Maquillaje</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fff0f3; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #d81b60; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: white; border-radius: 10px; padding: 15px; width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .precio { color: #e91e63; font-weight: bold; font-size: 18px; }
        .categoria { font-size: 12px; color: #777; text-transform: uppercase; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>✨ Catálogo de Maquillaje ✨</h1>
    <div class="grid">
        {% for p in productos %}
            <div class="card">
                {% if p.imagen %}
                    <img src="{{ p.imagen.url }}" alt="{{ p.nombre }}">
                {% endif %}
                <div class="categoria">{{ p.categoria }}</div>
                <h3>{{ p.nombre }}</h3>
                <p>{{ p.descripcion }}</p>
                <div class="precio">${{ p.precio }}</div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
